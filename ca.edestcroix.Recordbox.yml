app-id: ca.edestcroix.Recordbox
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: recordbox
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=wayland
  - --filesystem=xdg-music
  - --socket=pulseaudio
  - --env=RUST_LOG=recordbox=warn
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - "*.la"
  - "*.a"
modules:
  - name: recordbox
    builddir: true
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
    sources:
      - type: git
        url: https://codeberg.org/edestcroix/Recordbox/
        tag: v0.11.0-beta.3
        commit: 10478ca08c2884d78e38174091bf2ba55f7e6b89
      - type: inline
        contents: |
          [source.vendored-sources]
          directory = "cargo/vendor"

          [source.crates-io]
          replace-with = "vendored-sources"
        dest: .cargo
        dest-filename: config.toml
      - cargo-sources.json
