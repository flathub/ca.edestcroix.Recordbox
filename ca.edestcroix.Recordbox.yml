app-id: ca.edestcroix.Recordbox
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: recordbox
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=wayland
  - --filesystem=xdg-music
  - --socket=pulseaudio
  - --env=RUST_LOG=recordbox=warn
modules:
  - name: recordbox
    builddir: true
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
    sources:
      - type: git
        url: https://codeberg.org/edestcroix/Recordbox/
        tag: v0.11.0
        commit: f1a67ec4a8f7b13abb677515292cd003b469e1f0
      - type: inline
        contents: |
          [source.vendored-sources]
          directory = "cargo/vendor"

          [source.crates-io]
          replace-with = "vendored-sources"
        dest: .cargo
        dest-filename: config.toml
      - cargo-sources.json
